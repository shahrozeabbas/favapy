[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'favapy'
version = '2.0.0'
description = 'Infer Functional Associations using Variational Autoencoders on -Omics data.'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.10'
authors = [
    {name = 'Mikaela Koutrouli', email = 'mikaela.koutrouli@cpr.ku.dk'},
]
classifiers = [
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
]
dependencies = [
    'torch>=2.0',
    'lightning>=2.0',
    'numpy',
    'pandas',
    'anndata',
    'scipy',
]

[project.optional-dependencies]
test = [
    'pytest',
    'pytest-cov',
]
docs = [
    'sphinx',
    'nbsphinx',
    'sphinx-rtd-theme',
    'ipykernel',
]

[project.urls]
Homepage = 'https://github.com/mikelkou/VAE_Functional_associations'
'Bug Tracker' = 'https://github.com/mikelkou/VAE_Functional_associations/issues'

[tool.hatch.build.targets.wheel]
packages = ['src/favapy']

[tool.hatch.build.targets.sdist]
include = [
    '/src/favapy',
    '/README.md',
    '/LICENSE',
]
